<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f10">
<title>PHOTO STUDIO — インスタ画像加工</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Shippori+Mincho:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Geist+Mono:wght@400;500&display=swap');

/* ── トークン ───────────────────────────────────────────────────────────── */
:root {
  --bg:      #0f0f10;
  --panel:   #17171a;
  --panel2:  #1e1e22;
  --line:    #2a2a30;
  --line2:   #3a3a42;
  --text:    #ececf0;
  --muted:   #8b8b95;
  --accent:  #d8a15a;
  --accent-d:#a8763a;
  --danger:  #d05a4a;
  --shadow:  0 8px 24px rgba(0,0,0,.45);
  --safe-b:  env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
svg { display: block; }

/* ── ヘッダー ───────────────────────────────────────────────────────────── */
.app-head {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b {
  font-family: 'Geist Mono', monospace;
  font-size: 12px; font-weight: 500; letter-spacing: .18em;
  color: var(--accent); white-space: nowrap;
}
.brand span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.head-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn-ghost {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 999px;
  border: 1px solid var(--line2); background: var(--panel);
  font-size: 12px; font-weight: 700; color: var(--text);
}
.btn-ghost:active { background: var(--panel2); }
.btn-ghost svg { width: 14px; height: 14px; }

/* ── 空状態 ─────────────────────────────────────────────────────────────── */
#empty { padding: 48px 20px 80px; max-width: 520px; margin: 0 auto; text-align: center; }
#empty h1 {
  font-family: 'Shippori Mincho', serif;
  font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: .04em;
}
#empty p { color: var(--muted); font-size: 13px; margin: 0 0 28px; }
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 44px 20px;
  border: 1px dashed var(--line2); border-radius: 10px;
  background: var(--panel); width: 100%;
}
.drop.over { border-color: var(--accent); background: var(--panel2); }
.drop svg { width: 34px; height: 34px; color: var(--accent); }
.drop b { font-size: 15px; }
.drop small { color: var(--muted); font-size: 12px; }
.feat { margin-top: 26px; display: grid; gap: 8px; text-align: left; }
.feat div {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 12px; color: var(--muted);
  padding: 10px 12px; background: var(--panel); border-radius: 8px; border: 1px solid var(--line);
}
.feat svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; margin-top: 2px; }

/* ── ステージ（プレビュー） ─────────────────────────────────────────────── */
#editor { padding-bottom: calc(78px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
.stage-wrap { padding: 14px 14px 8px; display: flex; justify-content: center; }
.stage {
  position: relative;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  touch-action: none;
  box-shadow: var(--shadow);
  max-width: 100%;
}
.stage canvas { display: block; width: 100%; height: 100%; }
.stage-hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  padding: 5px 12px; border-radius: 999px;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  font-size: 10px; color: #ddd; letter-spacing: .04em;
  pointer-events: none; transition: opacity .4s; white-space: nowrap;
}
.stage-hint.hide { opacity: 0; }

/* ── フィルムストリップ ─────────────────────────────────────────────────── */
.strip {
  display: flex; gap: 8px; padding: 6px 14px 12px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.strip::-webkit-scrollbar { height: 0; }
.thumb {
  position: relative; flex-shrink: 0;
  width: 56px; height: 70px; border-radius: 5px; overflow: hidden;
  border: 2px solid transparent; background: var(--panel2);
}
.thumb.sel { border-color: var(--accent); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb i {
  position: absolute; left: 3px; top: 3px;
  font-style: normal; font-family: 'Geist Mono', monospace; font-size: 9px;
  padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,.6); color: #fff;
}
.thumb-add {
  flex-shrink: 0; width: 56px; height: 70px; border-radius: 5px;
  border: 1px dashed var(--line2); background: var(--panel);
  display: flex; align-items: center; justify-content: center; color: var(--muted);
}
.thumb-add svg { width: 18px; height: 18px; }
.strip-tools { display: flex; gap: 6px; padding: 0 14px 10px; }
.strip-tools button {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel);
  font-size: 11px; color: var(--muted);
}
.strip-tools button svg { width: 13px; height: 13px; }
.strip-tools button.del { color: var(--danger); }

/* ── タブ ───────────────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 4px; padding: 0 14px 12px;
}
.tabs button {
  flex: 1; padding: 10px 4px; border-radius: 7px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.tabs button.on { background: var(--accent); color: #1a1206; border-color: var(--accent); }

/* ── パネル ─────────────────────────────────────────────────────────────── */
.panel { display: none; padding: 0 14px; max-width: 560px; margin: 0 auto; }
.panel.on { display: block; }
.row { margin-bottom: 18px; }
.row > label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  color: var(--muted); margin-bottom: 8px;
}
.row > label var {
  font-family: 'Geist Mono', monospace; font-style: normal;
  font-size: 11px; color: var(--accent);
}
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1; min-width: 68px; padding: 10px 6px;
  border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text);
  font-size: 12px; font-weight: 700;
}
.seg button small { display: block; font-size: 9px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.seg button.on { border-color: var(--accent); background: var(--panel2); color: var(--accent); }
.seg button.on small { color: var(--accent-d); }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 2px; background: var(--line2);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--bg);
  margin-top: -9px; box-shadow: 0 1px 4px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line2); }
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border: 3px solid var(--bg);
  border-radius: 50%; background: var(--accent);
}

.field {
  width: 100%; padding: 11px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  font-size: 14px; outline: none;
}
.field:focus { border-color: var(--accent-d); }
textarea.field { resize: vertical; min-height: 62px; line-height: 1.5; }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid var(--line2); position: relative;
}
.sw.on { border-color: var(--accent); transform: scale(1.08); }

.linkbtn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 11px; border-radius: 6px;
  border: 1px solid var(--line2); background: var(--panel);
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.linkbtn svg { width: 14px; height: 14px; }
.linkbtn.accent { color: var(--accent); border-color: var(--accent-d); }

/* ── 保存バー ───────────────────────────────────────────────────────────── */
.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; gap: 8px;
  padding: 10px 14px calc(10px + var(--safe-b));
  background: rgba(15,15,16,.96);
  border-top: 1px solid var(--line);
}
.savebar button {
  flex: 1; padding: 14px 8px; border-radius: 7px;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.savebar button svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); color: #1a1206; }
.btn-primary:disabled { opacity: .5; }
.btn-sec { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); }

/* ── オーバーレイ（保存済み一覧 / 1枚表示） ─────────────────────────────── */
.overlay {
  display: none;
  position: fixed; inset: 0; z-index: 70;
  background: var(--bg);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.show { display: block; }
.overlay.dark { background: #08080a; }
.ov-head {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 14px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.overlay.dark .ov-head { background: #08080a; }
.ov-head b { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-body { padding: 14px 14px calc(30px + var(--safe-b)); max-width: 620px; margin: 0 auto; }
.ov-note { font-size: 11px; color: var(--muted); margin: 0 0 14px; line-height: 1.6; }
.ov-status { font-size: 12px; color: var(--muted); padding: 10px 0; }
.ov-status.err { color: #ffb4a8; }
/* ボトルごとの行 */
.lib-list { display: flex; flex-direction: column; gap: 8px; }
.lib-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 8px 12px 8px 8px; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
}
.lib-row:active { background: var(--panel2); }
.lib-row > img {
  width: 52px; height: 65px; object-fit: cover; border-radius: 4px;
  flex-shrink: 0; background: var(--panel2);
}
.lib-row-body { flex: 1; min-width: 0; }
.lib-row-body b { display: block; font-size: 13px; font-weight: 700; line-height: 1.4; }
.lib-row-body small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.lib-row-go { color: var(--muted); flex-shrink: 0; }
.lib-row-go svg { width: 18px; height: 18px; }
.caption-box { margin-top: 22px; }
.caption-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.caption-head span { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
#caption-text {
  font-size: 13px; line-height: 1.75; min-height: 260px;
  resize: vertical; white-space: pre-wrap;
}
.caption-note { font-size: 10px; color: var(--muted); margin-top: 6px; }
.caption-note.saved { color: var(--accent); }
.bottle-actions { display: flex; gap: 8px; margin: 4px 0 16px; }
.bottle-actions button { flex: 1; padding: 14px 8px; border-radius: 7px; font-size: 13px; font-weight: 700; }
.lib-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lib-cell {
  position: relative; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden;
  background: var(--panel2); border: 1px solid var(--line); padding: 0;
}
.lib-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-cell span {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 14px 6px 5px; font-size: 9px; line-height: 1.3; text-align: left;
  color: #fff; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.8));
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#lib-view-img { max-width: 100%; border-radius: 6px; box-shadow: var(--shadow); }
.btn-danger {
  padding: 13px 18px; border-radius: 7px; font-weight: 700; font-size: 13px;
  background: transparent; border: 1px solid var(--danger); color: var(--danger);
  white-space: nowrap;
}
.btn-danger.armed { background: var(--danger); color: #fff; }

/* ── トースト ───────────────────────────────────────────────────────────── */
#toast {
  position: fixed; left: 50%; bottom: calc(96px + var(--safe-b));
  transform: translateX(-50%) translateY(10px);
  z-index: 90; max-width: 90vw;
  padding: 11px 18px; border-radius: 999px;
  background: var(--panel2); border: 1px solid var(--line2);
  font-size: 12px; font-weight: 700; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { border-color: var(--danger); color: #ffb4a8; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header class="app-head">
  <div class="brand"><b>PHOTO STUDIO</b><span>インスタ画像加工</span></div>
  <div class="head-actions">
    <button class="btn-ghost" onclick="openLibrary()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>
      保存済み
    </button>
    <button class="btn-ghost" id="btn-add-head" onclick="pickFiles()" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      写真を追加
    </button>
  </div>
</header>

<!-- ── 空状態 ── -->
<section id="empty">
  <h1>写真をインスタサイズに</h1>
  <p>トリミング・明るさ・文字入れをして、そのまま写真に保存できます</p>
  <button class="drop" id="drop" onclick="pickFiles()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-6 6-3-3-4 4"/>
    </svg>
    <b>写真を選ぶ</b>
    <small>複数枚まとめて選べます（カルーセル用）</small>
  </button>
  <div class="feat">
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/></svg><span>4:5 / 1:1 / 9:16 に自動フィット。指でドラッグ＆ピンチで位置と大きさを調整</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" stroke-width="1.2"/><path d="M12 3a9 9 0 010 18" fill="currentColor" stroke="none" opacity=".35"/></svg><span>明るさ・コントラスト・彩度・暖かみ。プリセットで一発補正</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg><span>見出し・サブテキストを明朝／ゴシックで。読みやすさ用の帯つき</span></div>
  </div>
</section>

<!-- ── エディタ ── -->
<section id="editor" style="display:none">
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="preview"></canvas>
      <div class="stage-hint" id="hint">ドラッグで位置 / ピンチ・ホイールで拡大</div>
    </div>
  </div>

  <div class="strip" id="strip"></div>
  <div class="strip-tools" id="strip-tools" style="display:none">
    <button onclick="moveItem(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>前へ</button>
    <button onclick="moveItem(1)">後へ<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="del" onclick="removeItem()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>この写真を削除</button>
  </div>

  <nav class="tabs">
    <button id="tab-size" class="on" onclick="switchPanel('size')">サイズ</button>
    <button id="tab-adj" onclick="switchPanel('adj')">調整</button>
    <button id="tab-text" onclick="switchPanel('text')">文字</button>
  </nav>

  <!-- サイズ -->
  <div class="panel on" id="panel-size">
    <div class="row">
      <label>比率<var id="v-ratio">1080 × 1350</var></label>
      <div class="seg" id="seg-ratio"></div>
    </div>
    <div class="row">
      <label>収め方</label>
      <div class="seg" id="seg-fit">
        <button data-v="cover" class="on">埋める<small>フチなし</small></button>
        <button data-v="contain">全体を入れる<small>見切れない</small></button>
      </div>
    </div>
    <div class="row" id="row-bg" style="display:none">
      <label>余白の背景</label>
      <div class="seg" id="seg-bg">
        <button data-v="blur" class="on">ぼかし</button>
        <button data-v="#ffffff">白</button>
        <button data-v="#000000">黒</button>
        <button data-v="#f2ece2">生成り</button>
      </div>
    </div>
    <div class="row">
      <label>拡大<var id="v-zoom">100%</var></label>
      <input type="range" id="r-zoom" min="100" max="400" step="1" value="100">
    </div>
    <div class="row">
      <label>傾き<var id="v-rot">0°</var></label>
      <input type="range" id="r-rot" min="-20" max="20" step="0.5" value="0">
    </div>
    <div class="row">
      <div class="seg">
        <button onclick="rotate90()"><svg style="width:14px;height:14px;display:inline-block;vertical-align:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v5h-5"/></svg> 90°回す</button>
        <button onclick="resetCrop()">位置をリセット</button>
      </div>
    </div>
  </div>

  <!-- 調整 -->
  <div class="panel" id="panel-adj">
    <div class="row">
      <label>プリセット</label>
      <div class="seg" id="seg-preset"></div>
    </div>
    <div class="row"><label>明るさ<var id="v-bri">0</var></label><input type="range" id="r-bri" min="-60" max="60" value="0"></div>
    <div class="row"><label>コントラスト<var id="v-con">0</var></label><input type="range" id="r-con" min="-60" max="60" value="0"></div>
    <div class="row"><label>彩度<var id="v-sat">0</var></label><input type="range" id="r-sat" min="-100" max="80" value="0"></div>
    <div class="row"><label>暖かみ<var id="v-warm">0</var></label><input type="range" id="r-warm" min="-50" max="50" value="0"></div>
    <div class="row"><label>周辺減光<var id="v-vig">0</var></label><input type="range" id="r-vig" min="0" max="80" value="0"></div>
    <div class="row">
      <button class="linkbtn" onclick="resetAdj()">調整をリセット</button>
    </div>
    <div class="row">
      <button class="linkbtn accent" onclick="applyToAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>
        この比率と調整を全部の写真に適用
      </button>
    </div>
  </div>

  <!-- 文字 -->
  <div class="panel" id="panel-text">
    <div class="row">
      <label>見出し</label>
      <input class="field" id="t-title" type="text" placeholder="例）山崎 12年" autocomplete="off">
    </div>
    <div class="row">

<script>
/* =========================================================================
   PHOTO STUDIO — インスタ用 画像加工（単一HTML / 完全クライアント処理）
   - サーバー送信なし。写真は端末内だけで処理する
   - 描画は Canvas 2D 直接描画（html2canvas は使わない：凍結する）
   - iOS 保存: navigator.share は await を挟まず同期的に呼ぶこと（NotAllowedError 対策）
   ========================================================================= */

// ── 定数 ──────────────────────────────────────────────────────────────────
const RATIOS = [
  { key:'4:5',  w:1080, h:1350, label:'4:5',  note:'投稿' },
  { key:'1:1',  w:1080, h:1080, label:'1:1',  note:'正方形' },
  { key:'9:16', w:1080, h:1920, label:'9:16', note:'ストーリー' },
];
const PRESETS = [
  { key:'none',  label:'なし',     adj:{ bri:0,  con:0,  sat:0,   warm:0,  vig:0  } },
  { key:'crisp', label:'くっきり', adj:{ bri:4,  con:18, sat:12,  warm:0,  vig:0  } },
  { key:'calm',  label:'しっとり', adj:{ bri:6,  con:-6, sat:-8,  warm:12, vig:12 } },
  { key:'film',  label:'フィルム', adj:{ bri:3,  con:12, sat:-16, warm:16, vig:34 } },
  { key:'mono',  label:'モノクロ', adj:{ bri:2,  con:14, sat:-100,warm:0,  vig:20 } },
  { key:'dark',  label:'暗所補正', adj:{ bri:24, con:6,  sat:6,   warm:6,  vig:0  } },
];
const COLORS = ['#ffffff', '#111111', '#d8a15a', '#e8dcc8', '#c8503c'];
const FONTS = {
  mincho: { title:'700 %spx "Shippori Mincho", serif',        sub:'600 %spx "Shippori Mincho", serif' },
  gothic: { title:'900 %spx "Noto Sans JP", sans-serif',      sub:'700 %spx "Noto Sans JP", sans-serif' },
  serif:  { title:'italic 700 %spx "Cormorant Garamond", serif', sub:'600 %spx "Cormorant Garamond", serif' },
};
const MAX_SRC = 2400;   // 読み込み時の長辺上限（メモリと速度のため）
const JPEG_Q  = 0.92;

// ── 状態 ──────────────────────────────────────────────────────────────────
let items = [];         // 画像アイテム配列
let cur = 0;            // 選択中 index
let ratio = RATIOS[0];
let panel = 'size';
let encodeTimer = null;
let drawScheduled = false;

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const uid = () => Math.random().toString(36).slice(2, 9);
const item = () => items[cur];

function defaults() {
  return {
    fit:'cover', bgMode:'blur',
    zoom:1, ox:0, oy:0, rot:0, quarter:0,
    adj:{ bri:0, con:0, sat:0, warm:0, vig:0 },
    preset:'none',
    txt:{ title:'', sub:'', font:'mincho', pos:'bottom', align:'left', scrim:'grad', color:'#ffffff', size:1 },
  };
}

// ── トースト ──────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, isErr ? 4200 : 2200);
}

// ── 読み込み ──────────────────────────────────────────────────────────────
function pickFiles() { $('file').click(); }

$('file').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length) await addFiles(files);
});

// ドラッグ&ドロップ（PC）
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  e.preventDefault(); $('drop') && $('drop').classList.add('over');
}));
document.addEventListener('dragleave', e => { if (e.relatedTarget === null) $('drop') && $('drop').classList.remove('over'); });
document.addEventListener('drop', async e => {
  const fl = e.dataTransfer && Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if (!fl || !fl.length) return;
  e.preventDefault();
  $('drop') && $('drop').classList.remove('over');
  await addFiles(fl);
});

async function addFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (!imgs.length) { toast('画像ファイルが見つかりません', true); return; }
  let ok = 0, ng = 0;
  for (const f of imgs) {
    try {
      const bmp = await loadBitmap(f);
      const it = Object.assign({ id: uid(), bmp, name: f.name, thumb: null, blob: null, dirty: true }, defaults());
      // 2枚目以降は直前の設定（比率以外の見た目）を引き継ぐと楽
      if (items.length) {
        const prev = items[items.length - 1];
        it.fit = prev.fit; it.bgMode = prev.bgMode;
        it.adj = Object.assign({}, prev.adj); it.preset = prev.preset;
        it.txt = Object.assign({}, prev.txt, { title:'', sub:'' });
      }
      items.push(it);
      ok++;
    } catch (err) {
      console.error('load failed', f.name, err);
      ng++;
    }
  }
  if (!ok) { toast('画像を読み込めませんでした' + (ng ? `（${ng}件）` : ''), true); return; }
  if (ng) toast(`${ok}枚を読み込み（${ng}件は非対応形式）`, true);
  cur = items.length - ok;              // 最初に追加した1枚を選択
  showEditor();
  setTimeout(() => $('hint').classList.add('hide'), 4000);   // 操作ヒントは自動で消す
  renderStrip();
  syncControls();
  draw();
  buildThumbs();
  scheduleEncode();
}

async function loadBitmap(file) {
  // createImageBitmap は EXIF 回転を反映できる。使えない環境は <img> にフォールバック
  if (window.createImageBitmap) {
    try {
      const probe = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const long = Math.max(probe.width, probe.height);
      if (long <= MAX_SRC) return probe;
      const k = MAX_SRC / long;
      const small = await createImageBitmap(file, {
        imageOrientation: 'from-image',
        resizeWidth: Math.round(probe.width * k),
        resizeHeight: Math.round(probe.height * k),
        resizeQuality: 'high',
      });
      probe.close && probe.close();
      return small;
    } catch (e) { /* fallthrough */ }
  }
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode error')); };
    im.src = url;
  });
}

function showEditor() {
  $('empty').style.display = 'none';
  $('editor').style.display = '';
  $('savebar').style.display = '';
  $('btn-add-head').style.display = '';
  $('strip-tools').style.display = items.length > 1 ? 'flex' : 'none';
}
function showEmpty() {
  $('empty').style.display = '';
  $('editor').style.display = 'none';
  $('savebar').style.display = 'none';
  $('btn-add-head').style.display = 'none';
}

// ── フィルムストリップ ────────────────────────────────────────────────────
function renderStrip() {
  const el = $('strip');
  el.innerHTML = items.map((it, i) =>
    `<button class="thumb${i === cur ? ' sel' : ''}" onclick="selectItem(${i})">` +
    (it.thumb ? `<img src="${it.thumb}" alt="">` : '') +
    `<i>${i + 1}</i></button>`
  ).join('') +
  `<button class="thumb-add" onclick="pickFiles()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`;
  $('strip-tools').style.display = items.length > 1 ? 'flex' : 'none';
  $('save-all-label').textContent = items.length > 1 ? `全部を保存（${items.length}枚）` : '写真に保存';
  $('btn-save-one').style.display = items.length > 1 ? '' : 'none';
}

function buildThumbs() {
  // ストリップ用サムネ（元画像そのままの見た目・軽量）
  items.forEach(it => {
    if (it.thumb) return;
    const c = document.createElement('canvas');
    const k = 120 / Math.max(it.bmp.width, it.bmp.height);
    c.width = Math.max(1, Math.round(it.bmp.width * k));
    c.height = Math.max(1, Math.round(it.bmp.height * k));
    c.getContext('2d').drawImage(it.bmp, 0, 0, c.width, c.height);
    it.thumb = c.toDataURL('image/jpeg', 0.7);
  });
  renderStrip();
}

function selectItem(i) {
  cur = clamp(i, 0, items.length - 1);
  renderStrip(); syncControls(); draw();
}

function moveItem(dir) {
  const j = cur + dir;
  if (j < 0 || j >= items.length) return;
  const [it] = items.splice(cur, 1);
  items.splice(j, 0, it);
  cur = j;
  renderStrip();
  toast(`${j + 1}枚目に移動`);
}

function removeItem() {
  if (!items.length) return;
  items.splice(cur, 1);
  cur = clamp(cur, 0, items.length - 1);
  if (!items.length) { showEmpty(); renderStrip(); return; }
  renderStrip(); syncControls(); draw();
}

// ── コントロール構築 ──────────────────────────────────────────────────────
function buildSegs() {
  $('seg-ratio').innerHTML = RATIOS.map(r =>
    `<button data-v="${r.key}"${r.key === ratio.key ? ' class="on"' : ''}>${r.label}<small>${r.note}</small></button>`).join('');
  $('seg-preset').innerHTML = PRESETS.map(p => `<button data-v="${p.key}">${p.label}</button>`).join('');
  $('sw-color').innerHTML = COLORS.map(c =>
    `<button class="sw" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');

  seg('seg-ratio', v => { ratio = RATIOS.find(r => r.key === v); dirtyAll(); layoutStage(); draw(); });
  seg('seg-fit',   v => { item().fit = v; $('row-bg').style.display = v === 'contain' ? '' : 'none'; markDirty(); draw(); });
  seg('seg-bg',    v => { item().bgMode = v; markDirty(); draw(); });
  seg('seg-preset',v => {
    const p = PRESETS.find(x => x.key === v);
    item().adj = Object.assign({}, p.adj); item().preset = v;
    syncControls(); markDirty(); draw();
  });
  seg('seg-font',  v => { item().txt.font = v; markDirty(); draw(); });
  seg('seg-pos',   v => { item().txt.pos = v; markDirty(); draw(); });
  seg('seg-align', v => { item().txt.align = v; markDirty(); draw(); });
  seg('seg-scrim', v => { item().txt.scrim = v; markDirty(); draw(); });
  seg('sw-color',  v => { item().txt.color = v; markDirty(); draw(); });
}

function seg(id, cb) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    Array.from($(id).children).forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    cb(b.dataset.v);
  });
}

function setSeg(id, v) {
  Array.from($(id).children).forEach(b => b.classList.toggle('on', b.dataset.v === v));
}

function bindRange(id, valId, fmt, apply) {
  const r = $(id);
  const onInput = () => {
    const v = parseFloat(r.value);
    $(valId).textContent = fmt(v);
    apply(v);
    draw();
  };
  r.addEventListener('input', onInput);
  r.addEventListener('change', () => { markDirty(); scheduleEncode(); });
}

function syncControls() {
  const it = item(); if (!it) return;
  $('v-ratio').textContent = `${ratio.w} × ${ratio.h}`;
  setSeg('seg-ratio', ratio.key);
  setSeg('seg-fit', it.fit);
  setSeg('seg-bg', it.bgMode);
  setSeg('seg-preset', it.preset);
  setSeg('seg-font', it.txt.font);
  setSeg('seg-pos', it.txt.pos);
  setSeg('seg-align', it.txt.align);
  setSeg('seg-scrim', it.txt.scrim);
  setSeg('sw-color', it.txt.color);
  $('row-bg').style.display = it.fit === 'contain' ? '' : 'none';

  $('r-zoom').value = Math.round(it.zoom * 100); $('v-zoom').textContent = Math.round(it.zoom * 100) + '%';
  $('r-rot').value  = it.rot;                    $('v-rot').textContent  = it.rot.toFixed(1).replace(/\.0$/, '') + '°';
  ['bri','con','sat','warm','vig'].forEach(k => {
    $('r-' + k).value = it.adj[k];
    $('v-' + k).textContent = (it.adj[k] > 0 ? '+' : '') + it.adj[k];
  });
  $('t-title').value = it.txt.title;
  $('t-sub').value   = it.txt.sub;
  $('r-tsize').value = Math.round(it.txt.size * 100);
  $('v-tsize').textContent = Math.round(it.txt.size * 100) + '%';
}

function switchPanel(p) {
  panel = p;
  ['size','adj','text'].forEach(k => {
    $('panel-' + k).classList.toggle('on', k === p);
    $('tab-' + k).classList.toggle('on', k === p);
  });
}

function markDirty() { const it = item(); if (it) { it.dirty = true; it.blob = null; } scheduleEncode(); }
function dirtyAll() { items.forEach(it => { it.dirty = true; it.blob = null; }); scheduleEncode(); }

function resetCrop() {
  const it = item();
  it.zoom = 1; it.ox = 0; it.oy = 0; it.rot = 0; it.quarter = 0;
  syncControls(); markDirty(); draw();
  toast('位置をリセットしました');
}
function rotate90() { const it = item(); it.quarter = (it.quarter + 1) % 4; it.ox = 0; it.oy = 0; markDirty(); draw(); }
function resetAdj() {
  const it = item();
  it.adj = { bri:0, con:0, sat:0, warm:0, vig:0 }; it.preset = 'none';
  syncControls(); markDirty(); draw();
  toast('調整をリセットしました');
}
function applyToAll() {
  const src = item();
  items.forEach(it => {
    if (it === src) return;
    it.fit = src.fit; it.bgMode = src.bgMode;
    it.adj = Object.assign({}, src.adj); it.preset = src.preset;
    it.txt = Object.assign({}, it.txt, {
      font: src.txt.font, pos: src.txt.pos, align: src.txt.align,
      scrim: src.txt.scrim, color: src.txt.color, size: src.txt.size,
    });
  });
  dirtyAll();
  toast(`${items.length}枚に適用しました`);
}

// ── 幾何 ──────────────────────────────────────────────────────────────────
function srcSize(it) {
  const swap = it.quarter % 2 === 1;
  return { w: swap ? it.bmp.height : it.bmp.width, h: swap ? it.bmp.width : it.bmp.height };
}

function baseScale(it, W, H) {
  const { w:bw, h:bh } = srcSize(it);
  const th = it.rot * Math.PI / 180;
  const c = Math.abs(Math.cos(th)), s = Math.abs(Math.sin(th));
  if (it.fit === 'cover') {
    // 傾けても四隅が空かないよう、回転後のAABBで覆う
    return Math.max(W / (bw * c + bh * s), H / (bw * s + bh * c));
  }
  return Math.min(W / (bw * c + bh * s), H / (bw * s + bh * c));
}

function clampOffset(it, W, H) {
  const { w:bw, h:bh } = srcSize(it);
  const s = baseScale(it, W, H) * it.zoom;
  const th = it.rot * Math.PI / 180;
  const c = Math.abs(Math.cos(th)), si = Math.abs(Math.sin(th));
  const aw = (bw * c + bh * si) * s, ah = (bw * si + bh * c) * s;
  const mx = Math.max(0, (aw - W) / 2) / W;
  const my = Math.max(0, (ah - H) / 2) / W;   // oy も W 基準（比率非依存にするため）
  it.ox = clamp(it.ox, -mx, mx);
  it.oy = clamp(it.oy, -my, my);
}

// ── 描画 ──────────────────────────────────────────────────────────────────
function drawPhoto(ctx, it, W, H) {
  const s = baseScale(it, W, H) * it.zoom;
  ctx.save();
  ctx.translate(W / 2 + it.ox * W, H / 2 + it.oy * W);
  ctx.rotate(it.rot * Math.PI / 180);
  ctx.rotate(it.quarter * Math.PI / 2);
  ctx.scale(s, s);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(it.bmp, -it.bmp.width / 2, -it.bmp.height / 2);
  ctx.restore();
}

function drawBlurBg(ctx, it, W, H) {
  // ctx.filter は端末差が大きいので、縮小→拡大でぼかす（どこでも動く）
  const tw = 32, th = Math.max(1, Math.round(32 * H / W));
  const t = document.createElement('canvas');
  t.width = tw; t.height = th;
  const tc = t.getContext('2d');
  const { w:bw, h:bh } = srcSize(it);
  const k = Math.max(tw / bw, th / bh) * 1.15;
  tc.save();
  tc.translate(tw / 2, th / 2);
  tc.rotate(it.quarter * Math.PI / 2);
  tc.scale(k, k);
  tc.drawImage(it.bmp, -it.bmp.width / 2, -it.bmp.height / 2);
  tc.restore();
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(t, 0, 0, W, H);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(0, 0, W, H);
}

function applyAdjust(ctx, W, H, a) {
  if (!a.bri && !a.con && !a.sat && !a.warm) return;
  const img = ctx.getImageData(0, 0, W, H);
  const p = img.data;
  // 明るさ・コントラスト・暖かみは LUT にまとめる
  const C = a.con * 2.55;
  const F = (259 * (C + 255)) / (255 * (259 - C));
  const bri = a.bri * 2.2;
  const warm = a.warm * 0.7;
  const lutR = new Uint8ClampedArray(256), lutG = new Uint8ClampedArray(256), lutB = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) {
    const v = F * (i - 128) + 128 + bri;
    lutR[i] = v + warm;
    lutG[i] = v + warm * 0.12;
    lutB[i] = v - warm;
  }
  const sat = 1 + a.sat / 100;
  const doSat = a.sat !== 0;
  for (let i = 0; i < p.length; i += 4) {
    let r = lutR[p[i]], g = lutG[p[i + 1]], b = lutB[p[i + 2]];
    if (doSat) {
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      r = l + (r - l) * sat;
      g = l + (g - l) * sat;
      b = l + (b - l) * sat;
    }
    p[i] = r; p[i + 1] = g; p[i + 2] = b;
  }
  ctx.putImageData(img, 0, 0);
}

function drawVignette(ctx, W, H, amount) {
  if (!amount) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${amount / 100})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function fontOf(kind, which, px) { return FONTS[kind][which].replace('%s', px); }

function wrapLines(ctx, str, maxW) {
  const out = [];
  String(str).split('\n').forEach(para => {
    if (!para) { out.push(''); return; }
    let line = '';
    for (const ch of para) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = ch; }
      else line = test;
    }
    out.push(line);
  });
  return out;
}

function drawText(ctx, it, W, H) {
  const t = it.txt;
  const title = (t.title || '').trim();
  const sub = (t.sub || '').trim();
  if (!title && !sub) return;

  const pad = W * 0.075;
  const maxW = W - pad * 2;
  const ts = W * 0.062 * t.size;
  const ss = W * 0.031 * t.size;

  ctx.textBaseline = 'top';
  ctx.font = fontOf(t.font, 'title', ts);
  const tl = title ? wrapLines(ctx, title, maxW) : [];
  ctx.font = fontOf(t.font, 'sub', ss);
  const sl = sub ? wrapLines(ctx, sub, maxW) : [];

  const tLead = ts * 1.28, sLead = ss * 1.65;
  const gap = (tl.length && sl.length) ? ts * 0.42 : 0;
  const blockH = tl.length * tLead + gap + sl.length * sLead;

  let y;
  if (t.pos === 'top') y = pad * 1.1;
  else if (t.pos === 'center') y = (H - blockH) / 2;
  else y = H - blockH - pad * 1.15;

  // 読みやすさの背景
  const dark = isDark(t.color);
  if (t.scrim === 'grad') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const base = dark ? '255,255,255' : '0,0,0';
    if (t.pos === 'bottom') {
      g.addColorStop(0, `rgba(${base},0)`);
      g.addColorStop(Math.max(0, (y - H * 0.14) / H), `rgba(${base},0)`);
      g.addColorStop(1, `rgba(${base},.72)`);
    } else if (t.pos === 'top') {
      g.addColorStop(0, `rgba(${base},.72)`);
      g.addColorStop(Math.min(1, (y + blockH + H * 0.14) / H), `rgba(${base},0)`);
      g.addColorStop(1, `rgba(${base},0)`);
    } else {
      g.addColorStop(0, `rgba(${base},0)`);
      g.addColorStop(.5, `rgba(${base},.6)`);
      g.addColorStop(1, `rgba(${base},0)`);
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  } else if (t.scrim === 'band') {
    ctx.fillStyle = dark ? 'rgba(255,255,255,.86)' : 'rgba(0,0,0,.6)';
    ctx.fillRect(0, y - pad * 0.55, W, blockH + pad * 1.1);
  }

  const cx = t.align === 'center' ? W / 2 : pad;
  ctx.textAlign = t.align === 'center' ? 'center' : 'left';
  ctx.fillStyle = t.color;
  if (t.scrim === 'none') {
    ctx.shadowColor = dark ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.55)';
    ctx.shadowBlur = W * 0.018;
    ctx.shadowOffsetY = W * 0.003;
  }

  ctx.font = fontOf(t.font, 'title', ts);
  tl.forEach(l => { ctx.fillText(l, cx, y); y += tLead; });
  if (tl.length && sl.length) y += gap;
  if (sl.length) {
    ctx.font = fontOf(t.font, 'sub', ss);
    ctx.globalAlpha = 0.88;
    sl.forEach(l => { ctx.fillText(l, cx, y); y += sLead; });
    ctx.globalAlpha = 1;
  }
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.textAlign = 'left';
}

function isDark(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128;
}

function renderTo(ctx, it, W, H) {
  clampOffset(it, W, H);
  // 背景
  if (it.fit === 'contain') {
    if (it.bgMode === 'blur') drawBlurBg(ctx, it, W, H);
    else { ctx.fillStyle = it.bgMode; ctx.fillRect(0, 0, W, H); }
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  drawPhoto(ctx, it, W, H);
  applyAdjust(ctx, W, H, it.adj);
  drawVignette(ctx, W, H, it.adj.vig);
  drawText(ctx, it, W, H);
}

// ── プレビュー ────────────────────────────────────────────────────────────
function layoutStage() {
  const stage = $('stage');
  const availW = Math.min(document.documentElement.clientWidth - 28, 520);
  const availH = Math.max(240, window.innerHeight - 350);
  let w = availW, h = w * ratio.h / ratio.w;
  if (h > availH) { h = availH; w = h * ratio.w / ratio.h; }
  stage.style.width = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = $('preview');
  c.width = Math.min(Math.round(w * dpr), ratio.w);
  c.height = Math.round(c.width * ratio.h / ratio.w);
}

function draw() {
  if (drawScheduled) return;
  drawScheduled = true;
  requestAnimationFrame(() => {
    drawScheduled = false;
    const it = item(); if (!it) return;
    const c = $('preview');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, c.width, c.height);
    renderTo(ctx, it, c.width, c.height);
  });
}

// ── ドラッグ / ピンチ ─────────────────────────────────────────────────────
const pointers = new Map();
let pinchStart = null;

(function initGestures() {
  const stage = $('stage');
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = Array.from(pointers.values());
      pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: item().zoom };
    }
    $('hint').classList.add('hide');
  });
  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const it = item(); if (!it) return;
    const prev = pointers.get(e.pointerId);
    const w = stage.clientWidth;
    if (pointers.size === 1) {
      it.ox += (e.clientX - prev.x) / w;
      it.oy += (e.clientY - prev.y) / w;
      draw();
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinchStart) {
      const [a, b] = Array.from(pointers.values());
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      it.zoom = clamp(pinchStart.zoom * (d / pinchStart.d), 1, 4);
      $('r-zoom').value = Math.round(it.zoom * 100);
      $('v-zoom').textContent = Math.round(it.zoom * 100) + '%';
      draw();
    }
  });
  const end = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) { markDirty(); }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', e => {
    const it = item(); if (!it) return;
    e.preventDefault();
    it.zoom = clamp(it.zoom * (e.deltaY < 0 ? 1.06 : 0.94), 1, 4);
    $('r-zoom').value = Math.round(it.zoom * 100);
    $('v-zoom').textContent = Math.round(it.zoom * 100) + '%';
    draw(); scheduleEncode();
  }, { passive: false });
})();

// ── 書き出し ──────────────────────────────────────────────────────────────
function renderFull(it) {
  const c = document.createElement('canvas');
  c.width = ratio.w; c.height = ratio.h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  renderTo(ctx, it, ratio.w, ratio.h);
  return c;
}

function encodeItem(it) {
  return new Promise(res => {
    renderFull(it).toBlob(b => { it.blob = b; it.dirty = false; res(b); }, 'image/jpeg', JPEG_Q);
  });
}

// 編集が落ち着いたら裏で JPEG 化しておく（保存タップ時に await を挟まないため）
function scheduleEncode() {
  clearTimeout(encodeTimer);
  encodeTimer = setTimeout(async () => {
    for (const it of items) { if (it.dirty || !it.blob) await encodeItem(it); }
  }, 500);
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

function fileOf(it, i) {
  return new File([it.blob], `insta_${stamp()}_${String(i + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' });
}

function shareOrDownload(files) {
  // ★iOS: await を挟まず同期的に呼ぶ。挟むと NotAllowedError で拒否される
  if (navigator.canShare && navigator.canShare({ files })) {
    navigator.share({ files }).then(() => toast('共有シートから写真に保存できます'))
      .catch(err => { if (err && err.name !== 'AbortError') download(files); });
    return;
  }
  download(files);
}

function download(files) {
  files.forEach((f, i) => setTimeout(() => {
    const url = URL.createObjectURL(f);
    const a = document.createElement('a');
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, i * 260));
  toast(`${files.length}枚をダウンロードしました`);
}

function saveOne() {
  const it = item(); if (!it) return;
  if (!it.blob || it.dirty) { prepareThen(() => shareOrDownload([fileOf(it, cur)])); return; }
  shareOrDownload([fileOf(it, cur)]);
}

function saveAll() {
  if (!items.length) return;
  const notReady = items.some(it => !it.blob || it.dirty);
  if (notReady) { prepareThen(() => shareOrDownload(items.map(fileOf))); return; }
  shareOrDownload(items.map(fileOf));
}

// 未エンコードのときは、共有APIを非同期で呼ぶとiOSに拒否されるので一旦作ってから促す
function prepareThen(fn) {
  toast('書き出し中…');
  clearTimeout(encodeTimer);
  (async () => {
    for (const it of items) { if (it.dirty || !it.blob) await encodeItem(it); }
    if (navigator.canShare && navigator.canShare({ files: [fileOf(items[0], 0)] })) {
      toast('準備できました。もう一度「保存」をタップ');
    } else {
      fn();
    }
  })();
}

// ── 保存済み（クラウド保存 / R2） ────────────────────────────────────────
// 写真の加工そのものは端末内で完結する。R2に送るのは「アプリへ」を押したときだけ。
const API = 'https://whisky-proxy.33322666666mm.workers.dev';
let libItems = [];
let libGroups = [];
let libCur = null;
let bottleCur = null;
const bottleFiles = new Map();   // key → File（共有を同期で呼べるように先読みしておく）

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function keepInApp() {
  if (!items.length) return;
  const targets = items.length > 1 ? items : [item()];
  toast(`アプリに保存中…（${targets.length}枚）`);
  let ok = 0, ng = 0;
  for (let i = 0; i < targets.length; i++) {
    const it = targets[i];
    try {
      if (it.dirty || !it.blob) await encodeItem(it);
      const b64 = await blobToBase64(it.blob);
      const label = (it.txt.title || '').trim() || it.name.replace(/\.[^.]+$/, '');
      const res = await fetch(`${API}/upload`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: b64, mediaType: 'image/jpeg', prefix: 'studio', name: label }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
      ok++;
    } catch (e) { console.error(e); ng++; }
  }
  if (ng) toast(`${ok}枚を保存 / ${ng}枚は失敗しました`, true);
  else toast(`${ok}枚をアプリに保存しました`);
}

function openLibrary() { $('library').classList.add('show'); loadLibrary(); }
function closeLibrary() { $('library').classList.remove('show'); }

// 「001 銘柄名 (1/4)」からボトル番号・銘柄・何枚目かを取り出す
function parseLabel(name) {
  const m = String(name || '').match(/^(\d{3})\s+(.+?)\s*\((\d+)\/(\d+)\)\s*$/);
  if (!m) return null;
  return { no: m[1], title: m[2], slide: parseInt(m[3], 10), total: parseInt(m[4], 10) };
}

// 同じボトルの4枚をひとまとめにする
function groupItems(items) {
  const map = new Map();
  for (const it of items) {
    const p = parseLabel(it.name);
    const key = p ? `${p.no}|${p.title}` : `single|${it.key}`;
    if (!map.has(key)) {
      map.set(key, { key, no: p ? p.no : '', title: p ? p.title : (it.name || jstDate(it.uploaded)), items: [] });
    }
    map.get(key).items.push(Object.assign({ slide: p ? p.slide : 1 }, it));
  }
  const groups = [...map.values()];
  groups.forEach(g => g.items.sort((a, b) => a.slide - b.slide));
  groups.sort((a, b) => (a.no || 'zzz').localeCompare(b.no || 'zzz'));
  return groups;
}

async function loadLibrary() {
  const st = $('lib-status'), list = $('lib-list');
  st.className = 'ov-status'; st.textContent = '読み込み中…'; list.innerHTML = '';
  try {
    const res = await fetch(`${API}/studio/list`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    libItems = data.items || [];
    if (!libItems.length) {
      st.textContent = 'まだ何も保存されていません。写真を加工して「アプリへ」を押すと、ここに並びます。';
      return;
    }
    libGroups = groupItems(libItems);
    st.textContent = `${libGroups.length}本 / ${libItems.length}枚`;
    list.innerHTML = libGroups.map((g, i) =>
      `<button class="lib-row" onclick="openBottle(${i})">` +
      `<img src="${g.items[0].url}" loading="lazy" alt="">` +
      `<div class="lib-row-body"><b>${escapeHtml((g.no ? g.no + '  ' : '') + g.title)}</b>` +
      `<small>${g.items.length}枚</small></div>` +
      `<span class="lib-row-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></span>` +
      `</button>`
    ).join('');
  } catch (e) {
    st.className = 'ov-status err';
    st.textContent = '読み込みに失敗しました: ' + e.message;
  }
}

// ── 1本ぶん（4枚） ────────────────────────────────────────────────────────
function openBottle(i) {
  bottleCur = libGroups[i];
  disarmBottleDelete();
  $('bottle-name').textContent = (bottleCur.no ? bottleCur.no + '  ' : '') + bottleCur.title;
  $('bottle-grid').innerHTML = bottleCur.items.map((it, k) =>
    `<button class="lib-cell" onclick="openLibViewOf(${i},${k})">` +
    `<img src="${it.url}" loading="lazy" alt="">` +
    `<span>${it.slide}枚目</span></button>`
  ).join('');
  $('bottle-view').classList.add('show');
  loadCaption(bottleCur);
  // 保存ボタンを押した瞬間に共有できるよう、開いた時点で裏で取っておく
  prefetchBottle(bottleCur);
}

// ── 投稿の本文 ────────────────────────────────────────────────────────────
let captions = null;          // { "001": "本文…" }
let captionSaveTimer = null;

async function ensureCaptions() {
  if (captions) return captions;
  try {
    const res = await fetch(`${API}/studio/captions`);
    const data = await res.json();
    captions = data.captions || {};
  } catch (e) { captions = {}; }
  return captions;
}

async function loadCaption(g) {
  const ta = $('caption-text'), note = $('caption-note');
  ta.value = ''; note.className = 'caption-note'; note.textContent = '読み込み中…';
  const c = await ensureCaptions();
  if (bottleCur !== g) return;                   // 開き直されていたら書かない
  ta.value = c[g.no] || '';
  note.textContent = ta.value ? '書き換えるとそのまま保存されます' : '本文はまだありません';
}

function onCaptionInput() {
  const note = $('caption-note');
  note.className = 'caption-note';
  note.textContent = '入力中…';
  clearTimeout(captionSaveTimer);
  captionSaveTimer = setTimeout(saveCaption, 900);
}

async function saveCaption() {
  if (!bottleCur || !bottleCur.no) return;
  const text = $('caption-text').value;
  const note = $('caption-note');
  try {
    const res = await fetch(`${API}/studio/captions`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ captions: { [bottleCur.no]: text }, merge: true }),
    });
    const d = await res.json();
    if (!res.ok || d.error) throw new Error(d.error || `HTTP ${res.status}`);
    if (captions) captions[bottleCur.no] = text;
    note.className = 'caption-note saved';
    note.textContent = '保存しました';
  } catch (e) {
    note.className = 'caption-note';
    note.textContent = '保存に失敗しました: ' + e.message;
  }
}

function copyCaption() {
  const ta = $('caption-text');
  const text = ta.value;
  if (!text.trim()) { toast('本文がありません', true); return; }
  // クリップボードAPIはユーザー操作の中でしか使えない。ここはボタンの中なので可
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => toast('本文をコピーしました'))
      .catch(() => copyFallback(ta));
  } else {
    copyFallback(ta);
  }
}
function copyFallback(ta) {
  ta.focus();
  ta.setSelectionRange(0, ta.value.length);
  try {
    const ok = document.execCommand('copy');
    toast(ok ? '本文をコピーしました' : '長押しでコピーしてください', !ok);
  } catch (e) { toast('長押しでコピーしてください', true); }
}
function closeBottle() { disarmBottleDelete(); $('bottle-view').classList.remove('show'); bottleCur = null; }
function openLibViewOf(gi, k) {
  const g = libGroups[gi];
  libCur = g.items[k];
  $('lib-view-name').textContent = libCur.name || jstDate(libCur.uploaded);
  $('lib-view-img').src = libCur.url;
  $('lib-view').classList.add('show');
}

async function prefetchBottle(g) {
  const st = $('bottle-status');
  st.className = 'ov-status'; st.textContent = '書き出しを準備中…';
  const files = [];
  for (const it of g.items) {
    if (bottleFiles.has(it.key)) { files.push(bottleFiles.get(it.key)); continue; }
    try {
      const r = await fetch(it.url);
      const b = await r.blob();
      // 写真アプリで並び順が分かるよう「番号_何枚目」で名前を付ける
      const p = parseLabel(it.name);
      const fname = p ? `insta_${p.no}_${p.slide}.jpg` : it.key.replace(/^studio_/, 'insta_');
      const f = new File([b], fname, { type: 'image/jpeg' });
      bottleFiles.set(it.key, f);
      files.push(f);
    } catch (e) { /* 失敗したぶんは保存時にダウンロードで拾う */ }
  }
  if (bottleCur === g) {
    st.textContent = files.length === g.items.length
      ? `${files.length}枚 準備できました`
      : `${files.length}/${g.items.length}枚 準備できました`;
  }
}

function saveBottle() {
  if (!bottleCur) return;
  const files = bottleCur.items.map(it => bottleFiles.get(it.key)).filter(Boolean);
  if (!files.length) { $('bottle-status').textContent = 'まだ準備中です。数秒待ってからもう一度押してください'; prefetchBottle(bottleCur); return; }
  // ★iOS: ここで await を挟まないこと（挟むと共有が拒否される）
  shareOrDownload(files);
}

let bottleDelArmed = false, bottleDelTimer = null;
function armBottleDelete() {
  const b = $('btn-bottle-del');
  if (!bottleDelArmed) {
    bottleDelArmed = true;
    b.textContent = `もう一度押すと${bottleCur ? bottleCur.items.length : 0}枚削除`;
    b.classList.add('armed');
    clearTimeout(bottleDelTimer);
    bottleDelTimer = setTimeout(disarmBottleDelete, 4000);
    return;
  }
  disarmBottleDelete();
  deleteBottle();
}
function disarmBottleDelete() {
  bottleDelArmed = false; clearTimeout(bottleDelTimer);
  const b = $('btn-bottle-del');
  if (b) { b.textContent = '削除'; b.classList.remove('armed'); }
}
async function deleteBottle() {
  if (!bottleCur) return;
  const st = $('bottle-status');
  st.className = 'ov-status'; st.textContent = '削除中…';
  let ok = 0;
  for (const it of bottleCur.items) {
    try {
      const res = await fetch(`${API}/studio/delete`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: it.key }),
      });
      const d = await res.json();
      if (res.ok && !d.error) { ok++; bottleFiles.delete(it.key); }
    } catch (e) { /* 続行 */ }
  }
  closeBottle();
  toast(`${ok}枚を削除しました`);
  loadLibrary();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function jstDate(iso) {
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function openLibView(i) {
  libCur = libItems[i];
  $('lib-view-name').textContent = libCur.name || jstDate(libCur.uploaded);
  $('lib-view-img').src = libCur.url;
  $('lib-view').classList.add('show');
}
function closeLibView() { disarmDelete(); $('lib-view').classList.remove('show'); libCur = null; }

async function shareLibItem() {
  if (!libCur) return;
  try {
    const res = await fetch(libCur.url);
    const blob = await res.blob();
    const p = parseLabel(libCur.name);
    const fname = p ? `insta_${p.no}_${p.slide}.jpg` : libCur.key.replace(/^studio_/, 'insta_');
    const f = new File([blob], fname, { type: 'image/jpeg' });
    // ここは fetch の後なので iOS では share が拒否されることがある。その場合は download に落とす
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); toast('共有シートから写真に保存できます'); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    download([f]);
  } catch (e) { toast('保存に失敗しました: ' + e.message, true); }
}

// ネイティブの confirm はブラウザに抑制されて「押しても無反応」になることがあるので使わない。
// 1回目のタップで確認状態にし、2回目で実行する
let delArmed = false, delTimer = null;
function armDelete() {
  const b = $('btn-del');
  if (!delArmed) {
    delArmed = true;
    b.textContent = 'もう一度押すと削除';
    b.classList.add('armed');
    clearTimeout(delTimer);
    delTimer = setTimeout(disarmDelete, 4000);
    return;
  }
  disarmDelete();
  deleteLibItem();
}
function disarmDelete() {
  delArmed = false;
  clearTimeout(delTimer);
  const b = $('btn-del');
  if (b) { b.textContent = '削除'; b.classList.remove('armed'); }
}

async function deleteLibItem() {
  if (!libCur) return;
  try {
    const res = await fetch(`${API}/studio/delete`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: libCur.key }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    const gone = libCur.key;          // closeLibView() で libCur が null になる前に控える
    bottleFiles.delete(gone);
    closeLibView();
    toast('削除しました');
    if (bottleCur) closeBottle();     // 開いていたボトルは一覧に戻して取り直す
    loadLibrary();
  } catch (e) { toast('削除に失敗しました: ' + e.message, true); }
}

// ── 入力バインド ──────────────────────────────────────────────────────────
function initInputs() {
  bindRange('r-zoom', 'v-zoom', v => v + '%',                          v => { item().zoom = v / 100; });
  bindRange('r-rot',  'v-rot',  v => v.toFixed(1).replace(/\.0$/,'') + '°', v => { item().rot = v; });
  [['bri','明るさ'],['con','コントラスト'],['sat','彩度'],['warm','暖かみ'],['vig','周辺減光']].forEach(([k]) => {
    bindRange('r-' + k, 'v-' + k, v => (v > 0 ? '+' : '') + v, v => {
      item().adj[k] = v;
      item().preset = 'custom';
      setSeg('seg-preset', 'custom');
    });
  });
  bindRange('r-tsize', 'v-tsize', v => v + '%', v => { item().txt.size = v / 100; });

  $('t-title').addEventListener('input', e => { item().txt.title = e.target.value; draw(); });
  $('t-sub').addEventListener('input',   e => { item().txt.sub = e.target.value; draw(); });
  $('t-title').addEventListener('change', markDirty);
  $('t-sub').addEventListener('change', markDirty);

  window.addEventListener('resize', () => { layoutStage(); draw(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { layoutStage(); draw(); }, 240));
}

// ── 起動 ──────────────────────────────────────────────────────────────────
(async function init() {
  buildSegs();
  initInputs();
  layoutStage();
  // Canvas は「読み込み済みのフォント」しか使えないので先に確保する
  try {
    await Promise.all([
      document.fonts.load('700 100px "Shippori Mincho"'),
      document.fonts.load('900 100px "Noto Sans JP"'),
      document.fonts.load('italic 700 100px "Cormorant Garamond"'),
      document.fonts.load('600 100px "Cormorant Garamond"'),
    ]);
  } catch (e) { /* フォント未取得でもフォールバックで描ける */ }
  if (items.length) draw();
})();
</script>
